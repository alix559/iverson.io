# iverson.io — desktop companion (Sound Names UI + BLE receive).
#
#   pixi run serve     start the web app at http://localhost:5001
#   pixi run receive --code XXXX   connect to the iOS/Mac app over BLE and type glyphs

[workspace]
name = "iverson"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
serve = { cmd = "iverson", description = "Run the web app on http://localhost:5001" }
receive = { cmd = "iverson-receive", description = "Receive spoken numbers over BLE from iverson.io (pass --code XXXX)" }

[dependencies]
python = "3.14.*"
nbdev = ">=2.3"

[pypi-dependencies]
iverson = { path = ".", editable = true }
python-fasthtml = "*"
fastlite = ">=0.2.4, <0.3"
bleak = ">=0.22"

# macOS key injection + talk-key gate (required for `pixi run receive`)
[target.osx-arm64.pypi-dependencies]
pyobjc-framework-Quartz = "*"
pyobjc-framework-ApplicationServices = "*"

[feature.app.pypi-dependencies]
# Kept for `pixi run -e app …` compatibility
pyobjc-framework-Quartz = "*"
pyobjc-framework-ApplicationServices = "*"

[environments]
default = { solve-group = "default" }
app = { features = ["app"], solve-group = "default" }
