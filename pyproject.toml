[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iverson"
dynamic = ["version"]
description = "iverson.io desktop companion: Sound Names web UI and Bluetooth receive"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Alex", email = "alixjcob559@gmail.com"}]
keywords = ["bluetooth", "fasthtml", "speech", "glyphs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "python-fasthtml",
    "fastlite>=0.2.4,<0.3",
    "bleak>=0.22",
]

[project.urls]
Repository = "https://github.com/alix559/iverson-io"
Documentation = "https://alix559.github.io/iverson-io"

[project.optional-dependencies]
app = [
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
]

[project.scripts]
iverson = "iverson.main:main"
iverson-receive = "iverson.receive:main"

[project.entry-points.nbdev]
iverson = "iverson._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "iverson.__version__"}

[tool.setuptools.packages.find]
include = ["iverson"]

[tool.setuptools.package-data]
iverson = ["glyph_table.json", "static/*"]

[tool.nbdev]
lib_path = "iverson"
nbs_path = "nbs"
doc_path = "_docs"
